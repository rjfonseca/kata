version: "3"

tasks:
  generate:
    desc: "Run go generate"
    sources:
      - internal/i18n/locales/*.toml
      - tools/i18n-codegen/**/*.go
    generates:
      - internal/i18n/locales.go
    cmds:
      - go generate ./...

  build:
    desc: "Build the kata binary"
    deps:
      - generate
    cmds:
      - go build -o ./bin/kata ./cmd/kata

  install:
    desc: "Install the kata binary"
    deps:
      - generate
    cmds:
      - go install ./cmd/kata

  test:
    desc: "Run tests, excluding katas"
    deps:
      - generate
    cmds:
      - go test $(go list ./... | grep -v 'github.com/rjfonseca/kata/internal/assets/catalog')

  lint:
    desc: "Run linter"
    cmds:
      - golangci-lint run $(go list ./... | grep -v 'github.com/rjfonseca/kata/internal/assets/catalog' | sed 's|github.com/rjfonseca/kata|./|g')
      - go run ./tools/i18n-lint/

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf ./bin
