version: "3"

tasks:
  generate:
    desc: "Run go generate"
    sources:
      - internal/i18n/locales/*.toml
      - tools/i18n-codegen/**/*.go
    generates:
      - internal/i18n/locales.go
    cmds:
      - go generate ./...

  build:
    desc: "Build the kata binary"
    deps:
      - generate
    cmds:
      - go build -o ./bin/kata ./cmd/kata

  install:
    desc: "Install the kata binary"
    deps:
      - generate
    cmds:
      - go install ./cmd/kata

  test:
    desc: "Run tests, excluding katas"
    deps:
      - generate
    cmds:
      - go test ./...

  lint:
    desc: "Run linter"
    cmds:
      - golangci-lint run ./...
      - go run ./tools/i18n-lint/

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf ./bin
