# Mensagens da Interface de Linha de Comando (uso global, flags)
[cli]
usage = "Crie e execute katas de código"
flag_lang_usage = "Idioma para as mensagens (ex: en-US, pt-BR)"
flag_verbose_usage = "Habilita logs detalhados (debug)"
flag_quiet_usage = "Suprime logs informacionais"
flag_interactive_usage = "Habilita o modo interativo (loop)"

# --- Comando Config ---
[config]
usage = "Gerencia a configuração do kata"
flag_set_lang_usage = "Define o idioma global (ex: pt-BR)"
log_lang_updated = "Idioma atualizado"

# --- Comando Init ---
[init]
usage = "Inicializa um novo repositório de katas"
log_creating_dir = "Criando diretório 'katas'"
log_copying_catalog = "Copiando catálogo embutido"
log_copying_scaffold = "Copiando scaffold embutido"
log_copying_runners = "Copiando runners embutidos"
log_copying_i18n = "Copiando arquivos i18n embutidos"
log_creating_config = "Criando configuração do workspace (kata.toml)"
log_repo_initialized = "Repositório de katas inicializado"
error_dir_exists = "O diretório 'katas' já existe"

# --- Comando Start ---
[start]
usage = "Inicia um kata"
args_usage = "<nome-do-kata>"
prompt_select_kata = "Escolha um kata para iniciar"
log_no_katas_found = "Nenhum kata encontrado no catálogo."
flag_force_usage = "Sobrescreve o estado de um kata existente"
flag_dir_usage = "Diretório onde iniciar o kata"
flag_runner_usage = "Sobrescreve o runner padrão"
log_runner_override = "Sobrescrevendo configuração do runner"
error_kata_already_started = "Um kata já foi iniciado. Use --force para sobrescrever."
error_list_katas = "falha ao listar katas"
error_select_kata = "falha ao selecionar kata"
error_copy_failed = "Falha ao copiar o kata '%s' para .kata"
error_read_steps_failed = "Falha ao ler os passos para o kata '%s'"
error_no_steps = "O kata '%s' não possui passos"
error_read_config_failed = "Falha ao ler o config.toml para o kata '%s'"
error_copy_runner_failed = "Falha ao copiar o runner '%s' para a raiz do projeto"
error_scaffold_failed = "Falha ao aplicar o scaffold para o kata '%s'"
log_using_local_catalog = "Usando catálogo de katas local"
log_using_embedded_catalog = "Usando catálogo de katas embutido"
log_runner_selected = "Runner do kata selecionado"
log_using_local_runner = "Usando runner local"
log_using_embedded_runner = "Usando runner embutido"
log_scaffold_applied = "Aplicando scaffold do kata"
log_kata_started = "Kata iniciado com sucesso"
error_hook_on_kata_start_failed = "O hook 'on_kata_start' falhou"

# --- Comando Run ---
[run]
usage = "Executa os testes do kata"
error_read_cwd = "lendo diretório de trabalho"
error_create_executor = "criando executor de tarefas"
error_run_task = "executando tarefa 'test'"
flag_watch_usage = "Monitora alterações e re-executa os testes"
error_hook_before_run_failed = "O hook 'before_run' falhou"
log_hook_on_run_success_failed = "O hook 'on_run_success' falhou"
log_hook_on_run_fail_failed = "O hook 'on_run_fail' falhou"
log_hook_on_run_failed = "O hook 'on_run' falhou"

# --- Comando Next ---
[next]
usage = "Avança o kata para o próximo passo"
error_not_started = "Nenhum kata iniciado. Execute 'kata start <nome>' primeiro."
error_tests_failing = "Os testes estão falhando. Corrija-os antes de avançar."
error_apply_step = "Falha ao aplicar o passo '%s'"
log_advancing = "Avançando para o próximo passo"
log_completed = "Kata concluído! 🎉"
log_already_completed = "Kata já concluído! Você pode continuar refatorando e aprendendo."
log_hook_on_kata_finish_failed = "O hook 'on_kata_finish' falhou"

# --- Comando Task ---
[task]
usage = "Executa ou lista tarefas arbitrárias"
log_no_tasks = "Nenhuma tarefa disponível."
error_init_runner = "falha ao inicializar executor de tarefas"
error_list_tasks = "falha ao listar tarefas"

# --- Comando Completion ---
[completion]
usage = "Gera script de autocompletar para shell"
args_usage = "[bash|zsh|fish]"

# --- Comando List ---
[list]
usage = "Lista os katas disponíveis"
error_fetch = "falha ao listar katas"

# --- Comando Status ---
[status]
usage = "Mostra o status atual do kata"
error_read_state = "Falha ao ler o estado do kata (um kata foi iniciado?)"
field_kata = "Kata"
field_step = "Passo"
field_passing = "Testes Passando"
field_completed = "Concluído"
value_yes = "Sim"
value_no = "Não"

# --- Comando Reset ---
[reset]
usage = "Reinicia o passo atual ou o kata inteiro"
flag_hard_usage = "Reinicia para o início do kata (scaffold)"
flag_to_step_usage = "Reinicia para o início de um passo específico"
log_safety_backup = "Backup de segurança criado em %s"
log_restoring = "Restaurando checkpoint: %s"
log_reset_complete = "Reset concluído. Passo atual: %s"
error_checkpoint_not_found = "Checkpoint para o passo '%s' não encontrado. Você pode precisar avançar uma vez para criá-lo."
error_invalid_step = "Índice de passo inválido"

# --- Comando Update ---
[update]
usage = "Atualiza o kata CLI para a versão mais recente"
log_checking = "Procurando por atualizações..."
log_already_latest = "Você já está usando a versão mais recente: %s"
log_update_found = "Nova versão %s encontrada!"
log_updating = "Atualizando para %s..."
log_success = "Atualizado com sucesso para a versão %s"
error_check_failed = "Falha ao verificar atualizações"
error_update_failed = "Falha ao atualizar o binário"
error_parse_version = "Falha ao analisar a versão atual: %s"
error_locate_executable = "Falha ao localizar o executável"
log_dev_build = "Ignorando verificação de atualização para build de desenvolvimento"