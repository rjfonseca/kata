# kata.toml - Workspace configuration for the kata CLI

[workspace]
# List of files or directories that should NEVER be removed 
# during a 'reset' or 'start --force'.
# The system automatically protects: .git, .kata, katas, kata.toml, .task, .kata_backups
protected_paths = [
  ".vscode",
  ".idea",
  "vendor",
  "node_modules",
  ".venv"
]
